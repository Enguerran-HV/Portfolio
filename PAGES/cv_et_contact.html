<!DOCTYPE html>
<html lang="fr">

    <head>
        <title>cv_et_contact</title>
        <link rel="stylesheet" href="/Portfolio/style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>

        <div id="header-placeholder"></div>

        <!-- TITRE DE PAGE -->
        <header>
            CV et contact
        </header>
        <!-- PRÉSENTATION DE LA PAGE -->
        <article>
            <h1>
                <p>Mon CV ainsi que les moyens de me contacter</p>
            </h1>
        </article>
        <main>
            <div class="content-grid cv-table">
                <div class="content-row">
                    <div class="content-cell">
                        <div class="cv-pdf-container">
                            <object class="cv-pdf" data="/Portfolio/MEDIA/IMAGES/cv.pdf" type="application/pdf">
                                <p>Votre navigateur ne peut pas afficher le PDF.</p>
                                <a href="/Portfolio/MEDIA/IMAGES/cv.pdf">Ouvrir mon CV</a>
                            </object>
                        </div>
                    </div>
                    <div class="content-cell">
                        <ul class="tirets">
                            <p>
                                <li><a href="tel:+33602031423">Téléphone : 06 02 03 14 23</a></li>
                            </p>
                            <p>
                                <li>
                                    <a href="mailto:hollender.enguerran@orange.fr">Email :
                                        hollender.enguerran@orange.fr</a>
                                </li>
                            </p>
                        </ul>
                    </div>
                </div>

            </div>

        </main>

        <div id="footer-placeholder"></div>

        <script>
            fetch('/Portfolio/header.html')
                .then(res => res.text())
                .then(data => document.getElementById('header-placeholder').outerHTML = data);

            fetch('/Portfolio/footer.html')
                .then(res => res.text())
                .then(data => document.getElementById('footer-placeholder').outerHTML = data);
        </script>

    </body>

</html>
